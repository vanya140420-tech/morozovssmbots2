<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOROZOV SMM</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Подключаем React и ReactDOM напрямую без importmap для 100% стабильности -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Подключаем Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Подключаем Firebase SDK в виде модулей -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Делаем Firebase доступным глобально для App.jsx
        window.FirebaseApp = { initializeApp };
        window.FirebaseAuth = { getAuth, signInAnonymously, onAuthStateChanged, signOut };
        window.FirebaseFirestore = { getFirestore, doc, setDoc, getDoc, collection, addDoc };
    </script>

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0B1120; }
        ::-webkit-scrollbar-thumb { background: #1F2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
        body { margin: 0; background-color: #0A0F1D; color: white; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Загружаем и компилируем App.jsx -->
    <script type="text/babel" data-type="module" src="./App.jsx"></script>
</body>
</html>
